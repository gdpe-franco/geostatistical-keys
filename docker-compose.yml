services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./laravel:/var/www/html
    ports:
      - "8080:8000"
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit((int) ! @file_get_contents('http://127.0.0.1:8000')); "]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: geostatistical_keys
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
